/* ============================================================ HELPERS */
function localGet(key, def) { try { return JSON.parse(localStorage.getItem(key) || 'null') ?? def; } catch { return def; } }
function localSet(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

async function tryFetchTable(table, order) {
  try {
    const rows = await sb(`${table}?select=*${order ? `&order=${order}` : ''}`);
    return (rows && rows.length) ? rows : null;
  } catch { return null; }
}

  // Only play the page-entrance animation on an actual navigation. Background
  // data refreshes (prayer times, progress, kalam, etc.) re-render the same
  // page and must NOT restart the fade-in, or the UI flashes/flickers.

    html = html.replace(/\s*animate-fade-in\s*/g, ' ').replace(/\s*animate-slide-up\s*/g, ' ');
  }
  root.innerHTML = html;

  switch (state.page) {
    case 'home': afterHome(); break;
    case 'riyadhoh': afterRiyadhoh(); break;
    case 'quran-surah':
      if (surahReaderLoadedFor !== state.sub) { surahReaderLoadedFor = state.sub; afterSurahReader(state.sub); }
      break;
    case 'amalan': afterAmalan(); break;
    case 'muhasabah': afterMuhasabah(); break;
    case 'panduan': afterArticleList('panduan'); break;
    case 'adab': afterArticleList('adab'); break;
    case 'tanya': afterTanya(); break;
  }
  renderBottomNav();
}

function setLoginMode(m){ loginMode = m; render(); }
window.setLoginMode = setLoginMode;
function togglePass(id, btn){ const el=document.getElementById(id); const showing = el.type==='text'; el.type = showing?'password':'text'; btn.innerHTML = icon(showing?'eye':'eyeOff','',16); }
window.togglePass = togglePass;

function showLoginError(msg){ const e=document.getElementById('login-error'); e.textContent=msg; e.classList.remove('hidden'); }

async function doLogin() {
  const name = document.getElementById('li-name').value.trim();
  const pass = document.getElementById('li-pass').value;
  if (!name || !pass) return showLoginError('Masukkan nama dan password.');
  const btn = document.getElementById('login-submit'); btn.disabled = true; btn.textContent = 'Memproses...';
  try {
    const rows = await sb(`salik_accounts?name=eq.${encodeURIComponent(name)}&password=eq.${encodeURIComponent(pass)}&select=*`);
    if (rows && rows.length) { setSalik(rows[0]); navigate('home'); toast(`Assalamu'alaikum, ${rows[0].name}`); return; }
    showLoginError('Nama atau password salah.');
  } catch {
    // offline/demo fallback
    const local = localGet('rs_local_accounts', []);
    const found = local.find(a => a.name === name && a.password === pass);
    if (found) { setSalik(found); navigate('home'); toast(`Assalamu'alaikum, ${found.name} (mode lokal)`); return; }
    showLoginError('Tidak dapat terhubung ke server. Coba lagi atau daftar dalam mode lokal.');
  } finally { btn.disabled = false; btn.textContent = 'Masuk'; }
}
window.doLogin = doLogin;

async function doRegister() {
  const name = document.getElementById('rg-name').value.trim();
  const alamat = document.getElementById('rg-alamat').value.trim();
  const hp = document.getElementById('rg-hp').value.trim();
  const tgl = document.getElementById('rg-tgl').value;
  const username = document.getElementById('rg-user').value.trim();
  const pass = document.getElementById('rg-pass').value;
  if (!name || !pass) return showLoginError('Masukkan nama dan password.');
  if (!username) return showLoginError('Username wajib diisi.');
  if (!alamat) return showLoginError('Alamat wajib diisi.');
  if (!hp) return showLoginError('No HP wajib diisi.');
  if (!tgl) return showLoginError("Tanggal bai'at wajib diisi.");
  if (pass.length < 4) return showLoginError('Password minimal 4 karakter.');
  const btn = document.getElementById('login-submit'); btn.disabled = true; btn.textContent = 'Memproses...';
  const payload = { name, password: pass, alamat, no_hp: hp, tanggal_baiat: tgl, username };
  try {
    const existN = await sb(`salik_accounts?name=eq.${encodeURIComponent(name)}&select=id`);
    if (existN && existN.length) { showLoginError('Nama sudah digunakan. Silakan pilih nama lain.'); return; }
    const existU = await sb(`salik_accounts?username=eq.${encodeURIComponent(username)}&select=id`);
    if (existU && existU.length) { showLoginError('Username sudah digunakan. Silakan pilih username lain.'); return; }
    const created = await sb(`salik_accounts`, { method:'POST', headers:{ Prefer:'return=representation' }, body: JSON.stringify(payload) });
    if (created && created[0]) { setSalik(created[0]); navigate('home'); toast('Pendaftaran berhasil. Selamat datang!'); return; }
    showLoginError('Gagal mendaftar. Silakan coba lagi.');
  } catch {
    const local = localGet('rs_local_accounts', []);
    if (local.some(a => a.name === name)) return showLoginError('Nama sudah digunakan.');
    const acc = { id: uid(), ...payload, created_at: new Date().toISOString() };
    local.push(acc); localSet('rs_local_accounts', local);
    setSalik(acc); navigate('home'); toast('Tidak dapat terhubung server — akun dibuat dalam mode lokal.');
  } finally { btn.disabled = false; btn.textContent = 'Daftar'; }
}
window.doRegister = doRegister;

const PRAYER_NAMES = ['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'];
const PRAYER_LABELS = { Fajr:'Subuh', Sunrise:'Syuruq', Dhuhr:'Dzuhur', Asr:'Ashar', Maghrib:'Maghrib', Isha:'Isya' };
let homeData = { prayerTimes:null, locationName:'Lokasi Anda', kalam: FALLBACK_KALAM, kalamIndex:0, progress:null, loadingPrayer:true };

function parseTime(t){ const [h,m]=t.split(':').map(Number); const d=new Date(); d.setHours(h,m,0,0); return d; }
function getCurrentPrayer(times){ const now=new Date(); const prayers=PRAYER_NAMES.filter(n=>n!=='Sunrise'); let cur='Isha'; for(const p of prayers){ if(now>=parseTime(times[p])) cur=p; } return cur; }
function getNextPrayer(times){ const now=new Date(); const prayers=PRAYER_NAMES.filter(n=>n!=='Sunrise'); for(const p of prayers){ const t=parseTime(times[p]); if(now<t){ const diff=t-now; const h=Math.floor(diff/3600000); const m=Math.floor((diff%3600000)/60000); return {name:p,time:times[p],remaining:`${h}j ${m}m lagi`}; } } return {name:'Fajr',time:times['Fajr'],remaining:'Besok'}; }

function HijriDateHtml(){
  const today = new Date();
  let hijri = '';
  try { hijri = new Intl.DateTimeFormat('id-ID-u-ca-islamic', { day:'numeric', month:'long', year:'numeric' }).format(today); } catch { hijri=''; }
  const masehi = today.toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

async function fetchPrayerTimes(lat, lon, city) {
  try {
    const today = new Date();
    const d = `${today.getDate()}-${today.getMonth()+1}-${today.getFullYear()}`;
    const res = await fetch(`https://api.aladhan.com/v1/timings/${d}?latitude=${lat}&longitude=${lon}&method=11`);
    const json = await res.json();
    if (json.data?.timings) {
      const t = json.data.timings;
      homeData.prayerTimes = { Fajr:t.Fajr, Sunrise:t.Sunrise, Dhuhr:t.Dhuhr, Asr:t.Asr, Maghrib:t.Maghrib, Isha:t.Isha };
      homeData.locationName = city;
    }
  } catch {}
  homeData.loadingPrayer = false;
  if (state.page === 'home') render();
}

let kalamAutoTimer = null;
const KALAM_AUTO_ROTATE_MS = 7000;
const KALAM_TRANSITION_MS = 380;
function startKalamAutoRotate() {
  stopKalamAutoRotate();
  if (!homeData.kalam || homeData.kalam.length <= 1) return;
  kalamAutoTimer = setInterval(() => advanceKalam(1, false), KALAM_AUTO_ROTATE_MS);
}
function stopKalamAutoRotate() {
  if (kalamAutoTimer) { clearInterval(kalamAutoTimer); kalamAutoTimer = null; }
}
function goToKalam(nextIndex, isManual) {
  const el = document.getElementById('kalam-card-inner');
  if (!el) { homeData.kalamIndex = nextIndex; return; }
  el.classList.add('kalam-slide-out');
  setTimeout(() => {
    homeData.kalamIndex = nextIndex;
    el.innerHTML = KalamInnerHtml(homeData.kalam[nextIndex]);
    updateKalamDots(nextIndex);
    el.classList.remove('kalam-slide-out');
    el.classList.add('kalam-slide-in');
    void el.offsetHeight; // force reflow so the "slide-in" starting state is registered before it's removed
    requestAnimationFrame(() => el.classList.remove('kalam-slide-in'));
  }, KALAM_TRANSITION_MS);
  if (isManual) startKalamAutoRotate(); // restart the timer so it doesn't fire right after a manual click
}
function advanceKalam(dir, isManual) {
  if (!homeData.kalam || homeData.kalam.length <= 1) return;
  goToKalam((homeData.kalamIndex + dir + homeData.kalam.length) % homeData.kalam.length, isManual);
}
function jumpToKalam(i) {
  if (!homeData.kalam || i === homeData.kalamIndex) return;
  goToKalam(i, true);
}

      navigator.geolocation.getCurrentPosition(async pos => {
        const { latitude, longitude } = pos.coords;
        try {
          const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json`);
          const j = await r.json();
          const city = j.address?.city || j.address?.town || j.address?.county || 'Lokasi Anda';
          await fetchPrayerTimes(latitude, longitude, city);
        } catch { await fetchPrayerTimes(latitude, longitude, 'Lokasi Anda'); }
      }, async () => { await fetchPrayerTimes(-6.2088, 106.8456, 'Jakarta'); });
    } else { fetchPrayerTimes(-6.2088, 106.8456, 'Jakarta'); }
    loadProgress();
  }

}

async function afterSurahReader(n) {
  surahReaderData = { loading:true, ayahs:[], translations:{}, error:'', showTranslation:true, showLatin:false };
  try {
    const [arRes, trRes] = await Promise.all([
      fetch(`https://api.alquran.cloud/v1/surah/${n}`),
      fetch(`https://api.alquran.cloud/v1/surah/${n}/id.indonesian`),
    ]);
    const ar = await arRes.json(); const tr = await trRes.json();
    if (ar.code === 200) surahReaderData.ayahs = ar.data.ayahs.map(a=>({ number:a.number, text:a.text, numberInSurah:a.numberInSurah, juz:a.juz }));
    if (tr.code === 200) { const map={}; tr.data.ayahs.forEach(a=>map[a.numberInSurah]=a.text); surahReaderData.translations = map; }
  } catch { surahReaderData.error = 'Gagal memuat surah. Periksa koneksi internet.'; }
  surahReaderData.loading = false;
  if (state.page === 'quran-surah') { const b=document.getElementById('surah-body'); if (b) render(); }
}

const MUHASABAH_SECTION_META = { sholat:{label:'Ibadah Sholat',color:'emerald'}, tazkiyah:{label:'Tazkiyatun Nafs',color:'blue'}, sunnah:{label:'Amalan Sunnah Nabi',color:'teal'}, anggota_tubuh:{label:'Muhasabah Anggota Tubuh',color:'gold'}, hati:{label:'Muhasabah Hati',color:'rose'}, ruh:{label:'Muhasabah Ruh',color:'violet'} };
const MUHASABAH_ORDER = ['sholat','tazkiyah','sunnah','anggota_tubuh','hati','ruh'];
const MUH_COLORS = { emerald:{bg:'bg-emerald-50 border-emerald-200',text:'text-emerald-800',icon:'bg-emerald-700'}, blue:{bg:'bg-blue-50 border-blue-200',text:'text-blue-800',icon:'bg-blue-700'}, teal:{bg:'bg-teal-50 border-teal-200',text:'text-teal-800',icon:'bg-teal-700'}, gold:{bg:'bg-gold-50 border-gold-200',text:'text-gold-800',icon:'bg-gold-600'}, rose:{bg:'bg-rose-50 border-rose-200',text:'text-rose-800',icon:'bg-rose-600'}, violet:{bg:'bg-violet-50 border-violet-200',text:'text-violet-800',icon:'bg-violet-600'} };
let muhasabahItemsStore = null;
function ensureMuhasabahItemsStore() {
  if (muhasabahItemsStore) return;
  const saved = loadAdminOverride('muhasabah');
  if (saved) { muhasabahItemsStore = saved; return; }
  muhasabahItemsStore = {};
  MUHASABAH_ORDER.forEach(k => {
    muhasabahItemsStore[k] = MUHASABAH_DEFAULT_ITEMS[k].map((label,i)=>({ id:`local_${k}_${i}`, item_key:label.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''), label, sort_order:i+1, section:k }));
  });
}
function muhItemsFor(key){ ensureMuhasabahItemsStore(); return muhasabahItemsStore[key] || []; }
let muhasabahState = { expanded:'sholat', tab:'muhasabah' };

function muhasabahStorageKey(){ return `rs_muhasabah_${state.salik.id}_${todayStr()}`; }
function muhasabahEntry(){ return localGet(muhasabahStorageKey(), { sholat:{}, tazkiyah:{}, sunnah:{}, anggota_tubuh:{}, hati:{}, ruh:{}, notes:'' }); }

function MuhasabahPage() {
  const entry = muhasabahEntry();
  let totalItems=0, totalDone=0;
  MUHASABAH_ORDER.forEach(k=>{ const items=muhItemsFor(k); totalItems+=items.length; totalDone += items.filter(it=>entry[k]?.[it.label]).length; });
  const pct = totalItems ? Math.round((totalDone/totalItems)*100) : 0;
  return `
  <div class="page-container animate-fade-in">
    <div class="gradient-header px-5 pt-12 pb-5">
      <h1 class="text-white text-2xl font-bold">Muhasabah</h1>
      <p class="text-emerald-200 text-sm mt-1">Evaluasi Diri Harian</p>
      <div class="grid grid-cols-2 gap-2 mt-4 bg-white/10 p-1 rounded-2xl">
        <button onclick="muhSetTab('muhasabah')" class="py-2 rounded-xl text-sm font-semibold transition-all ${muhasabahState.tab==='muhasabah'?'bg-white text-emerald-800':'text-white/70'}">Muhasabah</button>
        <button onclick="muhSetTab('statistik')" class="py-2 rounded-xl text-sm font-semibold transition-all ${muhasabahState.tab==='statistik'?'bg-white text-emerald-800':'text-white/70'}">Statistik</button>
      </div>
    </div>
    <div class="px-4 py-5" id="muhasabah-body">${muhasabahState.tab==='muhasabah' ? MuhasabahListView(entry,pct) : MuhasabahStatView()}</div>
  </div>`;
}
function MuhasabahListView(entry, pct) {
  return `
  <div class="card p-4 mb-4">
    <div class="flex items-center justify-between mb-1"><span class="text-xs text-stone-500">Skor muhasabah hari ini</span><span class="text-sm font-bold text-emerald-700">${pct}%</span></div>
    <div class="h-2.5 bg-stone-100 rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-emerald-400 to-emerald-700 rounded-full transition-all" style="width:${pct}%"></div></div>
  </div>
  <div class="space-y-3">
    ${MUHASABAH_ORDER.map(key=>{
      const meta = MUHASABAH_SECTION_META[key]; const colors = MUH_COLORS[meta.color]; const items = muhItemsFor(key);
      const done = items.filter(it=>entry[key]?.[it.label]).length;
      const isOpen = muhasabahState.expanded===key;
      return `
      <div class="card overflow-hidden">
        <button onclick="muhToggleSection('${key}')" class="w-full p-4 flex items-center justify-between ${colors.bg} border-l-4">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg ${colors.icon} flex items-center justify-center">${icon('check','text-white',14)}</div>
            <div class="text-left"><p class="font-semibold text-sm ${colors.text}">${meta.label}</p><p class="text-xs text-stone-500">${done}/${items.length} selesai</p></div>
          </div>
          ${icon(isOpen?'chevronRight':'chevronRight', `transition-transform ${isOpen?'rotate-90':''} text-stone-400`,16)}
        </button>
        ${isOpen ? `<div class="p-3 space-y-2">${items.map(it=>`
          <button onclick="muhToggleItem('${key}','${it.label.replace(/'/g,"\\'")}')" class="w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-stone-50 text-left active99">
            <div class="w-5 h-5 rounded-md border-2 flex items-center justify-center flex-shrink-0 ${entry[key]?.[it.label]?colors.icon+' border-transparent':'border-stone-300'}">${entry[key]?.[it.label]?icon('check','text-white',12):''}</div>
            <span class="text-sm text-stone-700">${esc(it.label)}</span>
          </button>`).join('')}</div>` : ''}
      </div>`;
    }).join('')}
  </div>
  <div class="card p-4 mt-4">
    <label class="text-xs font-semibold text-stone-500 uppercase tracking-wide mb-2 block">Catatan Muhasabah</label>
    <textarea id="muh-notes" class="input-field" rows="3" placeholder="Tuliskan renungan atau evaluasi hari ini...">${esc(entry.notes||'')}</textarea>
    <button onclick="muhSaveNotes()" class="btn-primary w-full mt-3 flex items-center justify-center gap-2">${icon('save','',16)} Simpan Muhasabah</button>
  </div>`;
}
function MuhasabahStatView() {
  const days = [];
  for (let i=6;i>=0;i--) {
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = d.toISOString().split('T')[0];
    const entry = localGet(`rs_muhasabah_${state.salik.id}_${ds}`, null);
    let pct = 0;
    if (entry) { let total=0, done=0; MUHASABAH_ORDER.forEach(k=>{ const items=muhItemsFor(k); total+=items.length; done+=items.filter(it=>entry[k]?.[it.label]).length; }); pct = total?Math.round((done/total)*100):0; }
    days.push({ label: d.toLocaleDateString('id-ID',{weekday:'short'}), pct });
  }
  const avg = Math.round(days.reduce((s,d)=>s+d.pct,0)/days.length);
  return `
  <div class="card p-4 mb-4 text-center">
    <p class="text-xs text-stone-500 mb-1">Rata-rata 7 hari terakhir</p>
    <p class="text-3xl font-bold text-emerald-700">${avg}%</p>
  </div>
  <div class="card p-4">
    <div class="flex items-end justify-between gap-2" style="height:140px;">
      ${days.map(d=>`<div class="flex-1 flex flex-col items-center justify-end gap-1.5 h-full">
        <div class="w-full bg-emerald-100 rounded-t-lg relative flex items-end" style="height:100%;">
          <div class="w-full bg-gradient-to-t from-emerald-700 to-emerald-400 rounded-t-lg transition-all" style="height:${Math.max(4,d.pct)}%"></div>
        </div>
        <span class="text-[10px] text-stone-400 font-medium">${d.label}</span>
      </div>`).join('')}
    </div>
  </div>`;
}
function muhSetTab(t){ muhasabahState.tab=t; render(); }
function muhToggleSection(k){
  muhasabahState.expanded = muhasabahState.expanded===k?null:k;
  const entry = muhasabahEntry();
  let t=0,d=0; MUHASABAH_ORDER.forEach(key=>{const items=muhItemsFor(key);t+=items.length;d+=items.filter(it=>entry[key]?.[it.label]).length;});
  document.getElementById('muhasabah-body').innerHTML = MuhasabahListView(entry, t?Math.round(d/t*100):0);
}
function muhToggleItem(section, label) {
  const entry = muhasabahEntry();
  entry[section] = entry[section] || {};
  entry[section][label] = !entry[section][label];
  localSet(muhasabahStorageKey(), entry);
  let t=0,d=0; MUHASABAH_ORDER.forEach(k=>{const items=muhItemsFor(k);t+=items.length;d+=items.filter(it=>entry[k]?.[it.label]).length;});
  document.getElementById('muhasabah-body').innerHTML = MuhasabahListView(entry, t?Math.round(d/t*100):0);
}
function muhSaveNotes() {
  const entry = muhasabahEntry();
  entry.notes = document.getElementById('muh-notes').value;
  localSet(muhasabahStorageKey(), entry);
  toast('Muhasabah tersimpan.');
  sb(`muhasabah_entries?entry_date=eq.${todayStr()}&salik_id=eq.${state.salik.id}&select=id`).then(rows=>{
    const payload = { entry_date: todayStr(), salik_id: state.salik.id, sholat_data:entry.sholat, tazkiyah_data:entry.tazkiyah, sunnah_data:entry.sunnah, anggota_tubuh_data:entry.anggota_tubuh, hati_data:entry.hati, ruh_data:entry.ruh, notes:entry.notes };
    if (rows && rows[0]) sb(`muhasabah_entries?entry_date=eq.${todayStr()}&salik_id=eq.${state.salik.id}`, {method:'PATCH', body:JSON.stringify(payload)}).catch(()=>{});
    else sb(`muhasabah_entries`, {method:'POST', body:JSON.stringify(payload)}).catch(()=>{});
  }).catch(()=>{});
}
window.muhSetTab=muhSetTab; window.muhToggleSection=muhToggleSection; window.muhToggleItem=muhToggleItem; window.muhSaveNotes=muhSaveNotes;
let muhasabahItemsLoadedFromServer = false;
function afterMuhasabah(){
  if (muhasabahItemsLoadedFromServer) return; muhasabahItemsLoadedFromServer = true;
  ensureMuhasabahItemsStore();
  if (hasAdminOverride('muhasabah')) return; // local admin edits take priority — don't overwrite with server data
  tryFetchTable('muhasabah_items','section,sort_order').then(rows=>{
    if (rows && rows.length) {
      const grouped = {}; MUHASABAH_ORDER.forEach(k=>grouped[k]=[]);
      rows.forEach(r=>{ if(!grouped[r.section]) grouped[r.section]=[]; grouped[r.section].push(r); });
      muhasabahItemsStore = grouped;
      if (state.page==='muhasabah') render();
    }
  });
}

function renderContent(text) {
  return text.split('\n').filter(Boolean).map(line=>{
    if (line.startsWith('**') && line.endsWith('**')) return `<p class="font-bold text-stone-800 mt-3 mb-1">${esc(line.replace(/\*\*/g,''))}</p>`;
    const parts = line.split(/(\*\*[^*]+\*\*)/g);
    return `<p class="leading-relaxed text-stone-600 text-sm mb-1">${parts.map(p=>p.startsWith('**')?`<strong class="font-semibold text-stone-800">${esc(p.replace(/\*\*/g,''))}</strong>`:esc(p)).join('')}</p>`;
  }).join('');
}

  'Apa itu zikir dan bagaimana cara berzikir yang benar?': {
    answer: "**Pengertian Zikir**\nZikir secara bahasa berarti mengingat. Dalam istilah syariat, zikir adalah menyebut dan mengingat Allah SWT dengan lisan dan hati, baik melalui kalimat tauhid, tasbih, tahmid, takbir, istighfar, maupun membaca Al-Qur'an.\n\n**Kedudukan Zikir dalam Suluk**\nZikir adalah amalan inti seorang salik. Para ulama tasawuf menyebutnya sebagai 'makanan hati' — hati yang jarang berzikir akan mengeras dan gelap, sementara hati yang senantiasa berzikir akan bercahaya dan lembut.\n\n**Adab Berzikir yang Benar**\nBerzikir dianjurkan dalam keadaan suci (berwudhu), menghadap kiblat bila memungkinkan, dengan suara yang tenang, dan yang terpenting: hadirnya hati, bukan sekadar gerak lisan.\n\n**Tingkatan Zikir**\nUlama membagi zikir menjadi tiga tingkatan: zikir lisan (mengucapkan dengan lisan), zikir qalbi (mengingat dengan hati), dan zikir sirr (zikir rahasia yang menyatu dalam seluruh gerak dan diam seorang hamba.\n\n**Amalan Praktis**\nMulailah dengan istiqomah membaca wirid pagi dan petang, dawamkan istighfar dan sholawat, serta ikuti bimbingan zikir yang telah diijazahkan oleh mursyid, karena zikir yang bersanad memiliki keberkahan tersendiri.",

  },

function formatAnswer(text) {
  return text.split('\n').filter(l=>l.length).map(line=>{
    if (line.startsWith('**') && line.endsWith('**')) return `<p class="font-bold text-stone-800 mt-2 mb-1">${esc(line.replace(/\*\*/g,''))}</p>`;
    const parts = line.split(/(\*\*[^*]+\*\*)/g);
    return `<p class="leading-relaxed">${parts.map(p=>p.startsWith('**')?`<strong class="font-semibold text-stone-800">${esc(p.replace(/\*\*/g,''))}</strong>`:esc(p)).join('')}</p>`;
  }).join('');
}

/* ---- Automatic local "AI" answer engine: searches the latest reference
   content — fetched fresh from Supabase in real time whenever possible, so
   edits made anywhere show up immediately without needing a reload — and
   falls back to whatever is already cached on-device if the network isn't
   reachable at that moment. This runs on-device and always works, with or
   without an external AI service. ---- */
const TANYA_STOPWORDS = new Set(['apa','itu','yang','dan','bagaimana','dengan','untuk','dalam','adalah','ke','di','dari','saya','ini','atau','pada','akan','bisa','cara','tentang','jelaskan','sebutkan','mengapa','kenapa','apakah','ada','nya','saja','juga','agar','supaya','sang','para','oleh','jika','maka','tidak','tak','begitu','sangat','lebih']);
function tanyaTokenize(text) {
  return (text||'').toLowerCase().normalize('NFKD').replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/).filter(w=>w.length>2 && !TANYA_STOPWORDS.has(w));
}

async function fetchFreshTable(table, order, timeoutMs=4000) {
  try {
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), timeoutMs);
    const rows = await sb(`${table}?select=*${order?`&order=${order}`:''}`, { signal: controller.signal });
    clearTimeout(timer);
    return (rows && rows.length) ? rows : null;
  } catch { return null; }
}

async function getFreshCorpusData() {
  // Local admin overrides represent an explicit choice made on this device
  // and should not be silently clobbered by a live fetch; server data is
  // only used for tables that haven't been customized locally.
  const [kalamFresh, panduanFresh, adabFresh, amalanFresh] = await Promise.all([
    hasAdminOverride('kalam')   ? Promise.resolve(null) : fetchFreshTable('kalam_mursyid','sort_order'),
    hasAdminOverride('panduan')? Promise.resolve(null) : fetchFreshTable('panduan_articles','sort_order'),
    hasAdminOverride('adab')   ? Promise.resolve(null) : fetchFreshTable('adab_articles','sort_order'),

function buildTanyaCorpusFromData({ kalam, panduan, adab, amalan }) {
  const corpus = [];
  Object.entries(FAQ_ANSWERS).forEach(([q,v])=>{
    corpus.push({ title:q, text:v.answer.replace(/\*\*/g,' '), sources: v.sources && v.sources.length ? v.sources : ['Tanya Mursyid'], weight:1.4 });
  });
  (panduan||[]).forEach(a=>{
    corpus.push({ title:a.title, text:a.content.replace(/\*\*/g,' '), sources:[`Panduan: ${a.title}`], weight:1 });
  });
  (adab||[]).forEach(a=>{
    corpus.push({ title:a.title, text:a.content.replace(/\*\*/g,' '), sources:[`Adab: ${a.title}`], weight:1 });
  });
  (amalan||[]).forEach(a=>{
    corpus.push({ title:a.title, text:`${a.translation||''} ${a.notes||''}`, sources:[`Amalan: ${a.title}`], weight:0.8 });
  });
  (kalam||[]).forEach(k=>{
    corpus.push({ title:k.author||'Kalam Mursyid', text:k.quote||'', sources:[k.source || k.author || 'Kalam Mursyid'], weight:0.6 });
  });
  return corpus;
}
async function getTanyaCorpus() {
  const fresh = await getFreshCorpusData();
  return buildTanyaCorpusFromData(fresh);
}

function stemIndo(word) {
  // Light Indonesian suffix stripping so "mursyidnya" still matches "mursyid",
  // "amalannya" matches "amalan", etc. Intentionally simple — good enough for
  // keyword relevance matching, not meant to be linguistically precise.
  let w = word;
  w = w.replace(/(nya|kah|lah|pun|tah)$/,'');
  if (w.length > 4) w = w.replace(/(kan|kum|mu|ku)$/,'');
  return w.length >= 3 ? w : word;
}
async function localAiAnswer(question) {
  const qTokens = [...new Set(tanyaTokenize(question).map(stemIndo))];
  if (!qTokens.length) return null;
  const corpus = await getTanyaCorpus();
  const N = corpus.length;

  // Word-boundary tokenized matching (not raw substring search) so that,
  // e.g., the query word "blah" can never accidentally "match" because it
  // happens to sit inside an unrelated word like "hisablah".
  const entryWordCounts = corpus.map(entry => {
    const counts = {};
    tanyaTokenize(entry.title + ' ' + entry.text).map(stemIndo).forEach(w => { counts[w] = (counts[w]||0) + 1; });
    return counts;
  });
  const entryTitleWords = corpus.map(entry => new Set(tanyaTokenize(entry.title).map(stemIndo)));

  // Inverse-document-frequency style weighting: a term that shows up in
  // nearly every article (e.g. "salik", "allah", "hati") barely helps tell
  // entries apart, while a rare/specific term (e.g. "tahajud", "maqamat")
  // is a much stronger signal — so it should count for more.
  const df = {};
  qTokens.forEach(term => { df[term] = entryWordCounts.filter(c => c[term]).length; });

  const scored = corpus.map((entry, idx) => {
    const counts = entryWordCounts[idx];
    const titleWords = entryTitleWords[idx];
    let score = 0;
    qTokens.forEach(term => {
      const hits = counts[term] || 0;
      if (!hits) return;
      const idf = Math.log((N + 1) / (df[term] + 1)) + 0.4;
      score += hits * idf * (titleWords.has(term) ? 2 : 1);
    });
    return { entry, score: score * (entry.weight||1) };
  }).filter(s=>s.score>0).sort((a,b)=>b.score-a.score);

  if (!scored.length) return null;
  // Require a minimum confidence so a single coincidental common-word match
  // doesn't produce a misleading "relevant" answer for an unrelated question.
  if (scored[0].score < 1.3) return null;

  const top = scored.slice(0,3).filter(s => s.score >= scored[0].score * 0.3);
  let answer = `Pertanyaan ananda ini menyentuh beberapa hal yang baik untuk kita renungkan bersama.\n\n`;
  top.forEach(({entry}) => {
    const cleanText = entry.text.replace(/\n+/g,' ').trim();
    const excerpt = cleanText.length > 340 ? cleanText.slice(0,340).replace(/\s+\S*$/,'') + '…' : cleanText;
    answer += `**${entry.title}**\n${excerpt}\n\n`;
  });
  answer += `Bila ananda ingin membahasnya lebih dalam sesuai kondisi ananda sendiri, jangan sungkan menghubungi mursyid langsung melalui WhatsApp.`;
  const sources = [...new Set(top.flatMap(t=>t.entry.sources))];
  return { answer: answer.trim(), sources };
}

async function callOpenAiMursyid(question) {
  const apiKey = localGet('rs_openai_api_key', null);
  if (!apiKey) return null;
  const model = localGet('rs_openai_model', null) || 'gpt-4o-mini';
  const localMatch = await localAiAnswer(question);
  const contextBlock = localMatch
    ? `Referensi internal aplikasi yang mungkin relevan (data terkini):\n${localMatch.answer.replace(/\*\*/g,'')}`
    : 'Tidak ada referensi internal aplikasi yang cocok langsung — jawablah sepenuhnya dari pengetahuan keislamanmu.';

  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
    body: JSON.stringify({

      model,
      messages: [
        { role: 'system', content: MURSYID_SYSTEM_PROMPT },
        { role: 'user', content: `${contextBlock}\n\nPertanyaan salik: ${question}` },
      ],
      temperature: 0.75,
      frequency_penalty: 0.25,
      presence_penalty: 0.1,
    }),
  });
  if (!res.ok) {
    const errBody = await res.text().catch(()=> '');
    throw new Error(`OpenAI ${res.status}: ${errBody.slice(0,200)}`);
  }
  const data = await res.json();
  const answer = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content ? data.choices[0].message.content.trim() : '';
  if (!answer) throw new Error('OpenAI: respons kosong');
  const sources = ['AI Mursyid (OpenAI)', ...(localMatch ? localMatch.sources : [])];
  return { answer, sources: [...new Set(sources)] };
}

async function tanyaAsk(q) {
  q = (q||'').trim();
  if (!q || tanyaAccordionState.askedLoading) return;
  tanyaAccordionState.askedLoading = true;
  tanyaAccordionState.asked = null;
  document.getElementById('tanya-body').innerHTML = TanyaAskView();

  const finalize = (answer, sources) => {
    tanyaAccordionState.asked = { question:q, answer, sources: sources||[] };
    tanyaAccordionState.askedLoading = false;
    document.getElementById('tanya-body').innerHTML = TanyaAskView();
    sb(`tanya_mursyid_history`, { method:'POST', body: JSON.stringify({ question:q, answer, sources: sources||[], salik_id: state.salik.id }) }).catch(()=>{});
    const local = localGet(`rs_tanya_history_${state.salik.id}`, []);
    local.unshift({ question:q, answer, sources: sources||[], created_at:new Date().toISOString() });
    localSet(`rs_tanya_history_${state.salik.id}`, local.slice(0,50));
  };

  await new Promise(r => setTimeout(r, aiConfigured() ? 200 : 450)); // brief, natural thinking pause

  // 1) When a real AI (OpenAI) key is configured, it's the primary,
  //    automatic answer engine — it can draw on the Qur'an, hadith, and
  //    scholarly opinion far beyond what's stored in the app, while still
  //    being grounded with the app's own reference content as context.
  if (aiConfigured()) {
    try {
      const ai = await callOpenAiMursyid(q);
      if (ai) { finalize(ai.answer, ai.sources); return; }
    } catch (err) {
      console.warn('AI Mursyid (OpenAI) call failed, falling back to local references:', err);
    }
  }

  // 2) Exact match against a curated FAQ answer.
  if (FAQ_ANSWERS[q]) { const f = FAQ_ANSWERS[q]; finalize(f.answer, f.sources); return; }

  // 3) Automatic local "AI" answer, composed from the freshest reference
  //    data available (fetched live from Supabase when reachable) — always
  //    available, no external AI service required.
  const local = await localAiAnswer(q);
  if (local) { finalize(local.answer, local.sources); return; }

  // 4) Bonus: if the local references had nothing relevant, try the live
  //    service in case it's reachable and has broader knowledge.
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/tanya-mursyid`, { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${SUPABASE_ANON_KEY}` }, body: JSON.stringify({ question:q }) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    finalize(data.answer || 'Maaf, tidak dapat memproses pertanyaan ini.', data.sources || []);
    return;
  } catch {}

  // 4) Graceful fallback with a direct path to a real human mursyid.
  finalize("Maaf, referensi mengenai topik ini belum tersedia dalam pustaka internal aplikasi. Untuk bimbingan yang lebih mendalam dan sesuai kondisi ananda, silakan hubungi mursyid secara langsung melalui tombol WhatsApp di atas.", []);
}

function formatWaNumber(phone) {
  if (!phone) return null;
  let digits = String(phone).replace(/[^0-9]/g, '');
  if (!digits) return null;
  if (digits.startsWith('0')) digits = '62' + digits.slice(1);
  else if (!digits.startsWith('62')) digits = '62' + digits;
  return digits;
}
function waLinkForSalik(s) {
  const num = formatWaNumber(s.no_hp);

  const msg = encodeURIComponent(`Assalamu'alaikum ${s.name || ''}, `);
  return `https://wa.me/${num}?text=${msg}`;
}

async function adminLogin() {
  const pass = document.getElementById('admin-pass').value;
  // Local password always works first and is fully reliable — it does not
  // depend on the shared backend, which has its own separate, unknown
  // admin_password value that we don't control.
  const override = localGet('rs_admin_password_override', null);
  const localValidPass = override || 'hu4111';
  if (pass === localValidPass) { adminState.authed=true; adminState.error=''; render(); adminPreloadAll(); return; }
  // As a bonus, also accept the real server-configured password if it happens
  // to be reachable and set (for whoever actually manages that backend).
  try {
    const rows = await sb(`app_settings?key=eq.admin_password&select=value`);
    if (rows && rows[0] && rows[0].value === pass) { adminState.authed=true; adminState.error=''; render(); adminPreloadAll(); return; }
  } catch {}
  adminState.error = `Password admin salah. (Gunakan: ${localValidPass})`;
  render();
}

function adminSaveEdit() {
  const { kind, data } = adminEditing;
  const cfg = ADMIN_KIND[kind];
  if (kind==='kalam' && !data.quote) return toast('Isi teks kalam terlebih dahulu.');
  if ((kind==='amalan'||kind==='panduan'||kind==='adab') && !data.title) return toast('Isi judul terlebih dahulu.');
  if (kind==='wirid' && (!data.label || !data.arabic)) return toast('Isi nama dan teks Arab wirid.');
  if ((kind==='panduan'||kind==='adab') && !data.content) return toast('Isi konten artikel.');

  // Local save always succeeds immediately — this is the source of truth.
  const isNew = !data.id;
  const finalItem = { ...data, id: data.id || `local_${Date.now()}` };
  const items = cfg.getItems();
  const idx = items.findIndex(i=>String(i.id)===String(finalItem.id));
  if (idx>=0) items[idx] = finalItem; else items.push(finalItem);
  cfg.setItems(items);
  toast('Tersimpan.');
  adminEditing = null;
  document.getElementById('admin-body').innerHTML = AdminTabContent();

  // Best-effort background sync to the shared backend — never blocks the UI
  // and failures are silently ignored, since the local copy already succeeded.
  const payload = cfg.toPayload(data);
  (async () => {
    try {
      if (!isNew && !String(data.id).startsWith('local_')) {
        await sb(`${cfg.table}?id=eq.${data.id}`, { method:'PATCH', body: JSON.stringify(payload) });
      } else {
        await sb(`${cfg.table}`, { method:'POST', body: JSON.stringify(payload) });
      }
    } catch {}
  })();
}
window.adminSaveEdit = adminSaveEdit;

function adminDeleteItem(kind, id) {

  const cfg = ADMIN_KIND[kind];

  toast('Dihapus.');
  document.getElementById('admin-body').innerHTML = AdminTabContent();
  if (!String(id).startsWith('local_')) sb(`${cfg.table}?id=eq.${id}`, { method:'DELETE' }).catch(()=>{});
}

  const payload = { section: adminState.muhSection, item_key: data.item_key || data.label.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''), label: data.label, sort_order: data.sort_order || (muhItemsFor(adminState.muhSection).length+1) };
  ensureMuhasabahItemsStore();
  const arr = muhasabahItemsStore[adminState.muhSection];
  const isNew = !data.id;
  const finalItem = { ...payload, id: data.id || `local_${Date.now()}` };
  const idx = arr.findIndex(i=>String(i.id)===String(finalItem.id));
  if (idx>=0) arr[idx] = finalItem; else arr.push(finalItem);
  saveAdminOverride('muhasabah', muhasabahItemsStore);
  toast('Tersimpan.');
  adminEditing = null;
  document.getElementById('admin-body').innerHTML = AdminMuhasabahTab();

  (async () => {
    try {
      if (!isNew && !String(data.id).startsWith('local_')) await sb(`muhasabah_items?id=eq.${data.id}`, { method:'PATCH', body: JSON.stringify(payload) });
      else await sb(`muhasabah_items`, { method:'POST', body: JSON.stringify(payload) });
    } catch {}
  })();
}
window.adminSaveMuhItem = adminSaveMuhItem;

function adminDeleteMuhItem(id) {
  if (!confirm('Hapus item ini?')) return;
  ensureMuhasabahItemsStore();
  muhasabahItemsStore[adminState.muhSection] = muhasabahItemsStore[adminState.muhSection].filter(i=>String(i.id)!==String(id));
  saveAdminOverride('muhasabah', muhasabahItemsStore);
  toast('Dihapus.');
  document.getElementById('admin-body').innerHTML = AdminMuhasabahTab();
  if (!String(id).startsWith('local_')) sb(`muhasabah_items?id=eq.${id}`, { method:'DELETE' }).catch(()=>{});
}
window.adminDeleteMuhItem = adminDeleteMuhItem;

/* ---- Admin: Settings ---- */

  const overrideKinds = [
    {k:'kalam', l:'Kalam'}, {k:'amalan', l:'Amalan'}, {k:'wirid', l:'Wirid'},
    {k:'panduan', l:'Panduan'}, {k:'adab', l:'Adab'}, {k:'muhasabah', l:'Muhasabah'},
  ];
  const activeOverrides = overrideKinds.filter(o => hasAdminOverride(o.k));
  return `
  <div class="card p-5 space-y-3">
    <p class="font-semibold text-stone-700 text-sm">Ubah Password Admin</p>
    <p class="text-xs text-stone-400">Password saat ini: <span class="font-mono font-semibold text-stone-600">${esc(currentPass)}</span></p>
    <p class="text-xs text-stone-400">Password baru tersimpan di perangkat/browser ini dan langsung berlaku untuk login Panel Admin berikutnya.</p>
    <div class="relative">
      <input id="admin-newpass" type="${adminState.show?'text':'password'}" class="input-field pr-10" placeholder="Password baru (min. 4 karakter)">
      <button onclick="adminState.show=!adminState.show;render()" class="absolute right-3 top-1/2 -translate-y-1/2 text-stone-400">${icon(adminState.show?'eyeOff':'eye','',16)}</button>
    </div>
    <button onclick="adminSavePassword()" class="btn-primary w-full flex items-center justify-center gap-2">${icon('save','',16)} Simpan Password</button>
  </div>
  <div class="card p-5 space-y-3 mt-4">
    <p class="font-semibold text-stone-700 text-sm">Status Penyimpanan Konten</p>
    <p class="text-xs text-stone-400 leading-relaxed">Semua perubahan dari Panel Admin tersimpan langsung di perangkat/browser ini, jadi selalu berhasil walau server sedang bermasalah. Bagian yang sudah pernah diedit dari admin:</p>
    <div class="flex flex-wrap gap-1.5">
      ${activeOverrides.length ? activeOverrides.map(o=>`<span class="badge bg-emerald-100 text-emerald-700">${o.l}</span>`).join('') : '<span class="text-xs text-stone-400 italic">Belum ada konten yang diedit dari admin.</span>'}
    </div>
    ${activeOverrides.length ? `<button onclick="adminResetOverrides()" class="w-full text-sm bg-red-50 text-red-600 py-2.5 rounded-xl flex items-center justify-center gap-2 hover:bg-red-100 transition-colors">${icon('refresh','',14)} Kembalikan Semua ke Data Awal</button>` : ''}
  </div>
  <div class="card p-5 space-y-2 mt-4">
    <p class="font-semibold text-stone-700 text-sm">Data Realtime</p>
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full flex-shrink-0 ${sbRealtimeStatus==='connected'?'bg-emerald-500':sbRealtimeStatus==='connecting'?'bg-gold-400 animate-pulse':'bg-stone-300'}"></span>
      <span class="text-sm text-stone-600">${sbRealtimeStatus==='connected'?'Aktif — perubahan konten langsung ter-update':sbRealtimeStatus==='connecting'?'Menghubungkan...':'Tidak tersedia — memakai pembaruan saat halaman dibuka'}</span>
    </div>
    <p class="text-xs text-stone-400 leading-relaxed">Bila aktif, perubahan Kalam, Panduan, Adab, Amalan, Wirid, Muhasabah, dan daftar salik akan tampil otomatis di semua perangkat tanpa perlu memuat ulang halaman.</p>
  </div>`;
}
function adminSavePassword() {
  const val = document.getElementById('admin-newpass').value;
  if (!val || val.length < 4) return toast('Password minimal 4 karakter.');
  localSet('rs_admin_password_override', val);
  toast(`Password admin berhasil diubah menjadi "${val}".`);
  document.getElementById('admin-body').innerHTML = AdminSettingsTab();
}
window.adminSavePassword = adminSavePassword;
function adminResetOverrides() {
  if (!confirm('Ini akan menghapus semua perubahan admin di perangkat ini dan mengembalikan ke data awal/server. Lanjutkan?')) return;
  ['kalam','amalan','wirid','panduan','adab','muhasabah'].forEach(k => localStorage.removeItem(adminOverrideKey(k)));
  location.reload();
}
window.adminResetOverrides = adminResetOverrides;

/* ============================================================ REALTIME
   Live updates via Supabase Realtime (WebSocket): when content changes on
   the server — from this app's Admin panel elsewhere, or any other client —
   it's reflected here within moments, with no manual refresh needed. This
   is a progressive enhancement: the Supabase JS library loads from a CDN
   in the background, and if it's blocked or the realtime channel can't
   connect for any reason, the app keeps working exactly as before (relying
   on the fetch-fresh-data-on-demand behavior already built), completely
   silently. Local admin edits on this device always continue to take
   priority over anything received from realtime, same as everywhere else. */
let sbRealtimeStatus = 'connecting'; // 'connecting' | 'connected' | 'unavailable'
let sbRealtimeClient = null;

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

const refreshKalamFromRealtime = debounce(async () => {
  if (hasAdminOverride('kalam')) return;
  const rows = await tryFetchTable('kalam_mursyid','sort_order');
  if (rows) { homeData.kalam = rows; homeData.kalamIndex = 0; if (state.page==='home') { render(); toast('Kalam Mursyid diperbarui.'); } }
}, 600);
function refreshArticleFromRealtime(kind) {
  return debounce(async () => {
    if (hasAdminOverride(kind)) return;
    const cfg = ARTICLE_CONFIG[kind];
    const rows = await tryFetchTable(cfg.table,'sort_order');
    if (rows) { articleState[kind].items = rows; if (state.page===kind) { render(); toast('Konten diperbarui.'); } }
  }, 600);
}
const refreshPanduanFromRealtime = refreshArticleFromRealtime('panduan');
const refreshAdabFromRealtime = refreshArticleFromRealtime('adab');
const refreshAmalanFromRealtime = debounce(async () => {
  if (hasAdminOverride('amalan')) return;
  const rows = await tryFetchTable('amalan_texts','sort_order');
  if (rows) { amalanData.items = rows.map(normalizeAmalanRow); if (state.page==='amalan') { render(); toast('Konten diperbarui.'); } }
}, 600);
const refreshMuhasabahFromRealtime = debounce(async () => {
  if (hasAdminOverride('muhasabah')) return;
  const rows = await tryFetchTable('muhasabah_items','section,sort_order');
  if (rows && rows.length) {
    ensureMuhasabahItemsStore();
    const grouped = {}; MUHASABAH_ORDER.forEach(k=>grouped[k]=[]);
    rows.forEach(r=>{ if(!grouped[r.section]) grouped[r.section]=[]; grouped[r.section].push(r); });
    muhasabahItemsStore = grouped;
    if (state.page==='muhasabah') { render(); toast('Item muhasabah diperbarui.'); }
  }
}, 600);
const refreshWiridFromRealtime = debounce(async () => {
  if (hasAdminOverride('wirid')) return;
  const rows = await tryFetchTable('custom_wirid','sort_order');
  if (rows) { customWiridItems = rows; if (state.page==='riyadhoh') { render(); toast('Wirid diperbarui.'); } }
}, 600);
const refreshSalikListFromRealtime = debounce(() => {
  if (state.page==='mursyid' && mursyidState.authed && !mursyidState.selectedSalik) mursyidLoadSaliks();
}, 600);

function initSupabaseRealtime() {
  if (!window.supabase || typeof window.supabase.createClient !== 'function') { sbRealtimeStatus = 'unavailable'; return; }
  try {
    sbRealtimeClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const subscriptions = [
      ['kalam_mursyid', refreshKalamFromRealtime],
      ['panduan_articles', refreshPanduanFromRealtime],
      ['adab_articles', refreshAdabFromRealtime],
      ['amalan_texts', refreshAmalanFromRealtime],
      ['muhasabah_items', refreshMuhasabahFromRealtime],
      ['custom_wirid', refreshWiridFromRealtime],
      ['salik_accounts', refreshSalikListFromRealtime],
    ];
    const channel = sbRealtimeClient.channel('riyadhoh-salik-live');
    subscriptions.forEach(([table, handler]) => {
      channel.on('postgres_changes', { event: '*', schema: 'public', table }, (payload) => {
        try { handler(payload); } catch (e) { console.warn('Realtime handler error for', table, e); }
      });
    });
    channel.subscribe((status) => {
      if (status === 'SUBSCRIBED') sbRealtimeStatus = 'connected';
      else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') sbRealtimeStatus = 'unavailable';
    });
  } catch (e) {
    sbRealtimeStatus = 'unavailable';
    console.warn('Supabase Realtime failed to initialize; continuing without it:', e);
  }
}
function loadSupabaseRealtimeLibrary() {
  try {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
    script.async = true;
    script.onload = () => { try { initSupabaseRealtime(); } catch (e) { sbRealtimeStatus = 'unavailable'; } };
    script.onerror = () => { sbRealtimeStatus = 'unavailable'; };
    document.head.appendChild(script);
  } catch (e) { sbRealtimeStatus = 'unavailable'; }
}

/* ============================================================ INIT */
render();
loadSupabaseRealtimeLibrary();
</script>
